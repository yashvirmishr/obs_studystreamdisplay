<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Please Wait - Study Stream Display</title>
  <style>html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}</style>
</head>
<body>
  <script>
    // Keep the OBS Browser Source URL stable for the Please Wait scene while
    // using the main overlay's single shared implementation. Extra URL
    // parameters (e.g. ?layout=name) are passed through untouched.
    const params = new URLSearchParams(window.location.search);
    params.set('mode', 'wait');
    window.location.replace('/overlay.html?' + params.toString());
  </script>
  <noscript>Please enable JavaScript to display the Please Wait overlay.</noscript>
</body>
</html>
