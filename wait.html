<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Please Wait - Study Stream Chat</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(19, 26, 23, .93);
      --border: rgba(202, 220, 207, .18);
      --text: #f1f4f0;
      --muted: #a6b9ab;
      --accent: #91cba5;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .music-card {
      position: absolute;
      top: 42px;
      left: 48px;
      display: flex;
      align-items: center;
      gap: 13px;
      width: 430px;
      max-width: calc(100vw - 96px);
      padding: 14px 17px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--panel);
      box-shadow: 0 14px 40px rgba(0, 0, 0, .24);
      backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity .3s ease, transform .3s ease;
    }

    .music-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .youtube-mark {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 39px;
      height: 29px;
      border-radius: 8px;
      background: #ef4444;
    }

    .music-copy { min-width: 0; flex: 1; }
    .music-kicker {
      color: var(--muted);
      font-size: 9px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .music-title {
      margin-top: 5px;
      overflow: hidden;
      color: var(--text);
      font-size: 14px;
      line-height: 1.25;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .music-artist {
      margin-top: 3px;
      overflow: hidden;
      color: #b3bdb6;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .chat-card{position:absolute;right:48px;bottom:42px;width:340px;height:430px;display:none;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:15px;background:var(--panel);box-shadow:0 12px 34px rgba(0,0,0,.2);backdrop-filter:blur(12px)}
    .chat-card.visible{display:flex}
    .chat-head{height:42px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(202,220,207,.16)}
    .chat-title{color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.16em}
    .chat-channel{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#b8dcc3;font-size:10px;font-weight:650}
    .chat-frame{width:100%;height:calc(100% - 42px);border:0;background:transparent}

    @media(max-width:700px){
      .chat-card{right:20px;bottom:20px;width:min(340px,calc(100vw - 40px));height:380px}
      .music-card{left:20px;top:20px;width:min(365px,calc(100vw - 40px))}
    }

  </style>
</head>
<body>
  <!-- The wait scene keeps the main study overlay chat panel unchanged and moves only the music card to the top-left. -->
  <aside class="music-card" id="musicCard" aria-live="polite">
    <div class="youtube-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
        <path d="M8 5.8v12.4L18 12 8 5.8z"></path>
      </svg>
    </div>
    <div class="music-copy">
      <div class="music-kicker">Now playing · YouTube</div>
      <div class="music-title" id="musicTitle"></div>
      <div class="music-artist" id="musicArtist"></div>
    </div>
  </aside>

  <aside class="chat-card" id="chatCard">
    <div class="chat-head">
      <span class="chat-title">LIVE CHAT</span>
      <span class="chat-channel" id="chatChannel"></span>
    </div>
    <iframe
      class="chat-frame"
      id="chatFrame"
      title="Combined Twitch and Kick live chat"
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </aside>

  <script>
    const DEFAULTS = {
      musicTitle: '', musicArtist: '', showMusic: true,
      twitchChannel: '', kickChannel: ''
    };
    const $ = (id) => document.getElementById(id);
    let state = { ...DEFAULTS };


    function render() {
      const twitch = String(state.twitchChannel || '').trim().toLowerCase();
      const kick = String(state.kickChannel || '').trim().toLowerCase();
      const chatKey = `${twitch}|${kick}`;

      $('chatCard').classList.toggle('visible', Boolean(twitch || kick));
      $('chatChannel').textContent = [
        twitch ? 'TWITCH' : '',
        kick ? 'KICK' : ''
      ].filter(Boolean).join(' + ');

      const frame = $('chatFrame');
      const params = new URLSearchParams();
      if (twitch) params.set('twitch', twitch);
      if (kick) params.set('kick', kick);
      params.set('fade', '120');
      params.set('size', '13');
      params.set('max', '14');
      const chatUrl = (twitch || kick)
        ? 'https://unified-chat.com/overlay?' + params.toString()
        : '';
      if (frame.dataset.channel !== chatKey) {
        frame.dataset.channel = chatKey;
        frame.src = chatUrl || 'about:blank';
      }

      const hasMusic = Boolean(state.showMusic && state.musicTitle);
      $('musicCard').classList.toggle('visible', hasMusic);
      $('musicTitle').textContent = state.musicTitle || '';
      $('musicArtist').textContent = state.musicArtist || '';
      $('musicArtist').style.display = state.musicArtist ? 'block' : 'none';
    }

    async function refreshState() {
      try {
        const response = await fetch('/api/state', { cache: 'no-store' });
        if (!response.ok) throw new Error(`State request failed: ${response.status}`);
        state = { ...DEFAULTS, ...await response.json() };
        render();
      } catch (error) {
        // A transient local-server error leaves the last successful display in place.
      }
    }

    render();
    refreshState();
    window.setInterval(refreshState, 1000);
  </script>
</body>
</html>
