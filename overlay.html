<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Status Overlay</title><style>
:root{--panel:rgba(19,26,23,.93);--border:rgba(202,220,207,.18);--text:#f1f4f0;--muted:#a6b9ab;--accent:#91cba5}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text)}body{padding:42px 48px}.panel{position:absolute;top:42px;right:48px;width:430px;padding:25px 27px 23px;border:1px solid var(--border);border-radius:18px;background:var(--panel);box-shadow:0 14px 42px rgba(0,0,0,.2);backdrop-filter:blur(12px)}.top,.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.eyebrow{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.clock{margin-top:5px;font-size:35px;font-weight:650;letter-spacing:-.045em;font-variant-numeric:tabular-nums}.date{margin-top:3px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 11px;background:rgba(145,203,165,.13);color:#b8dcc3;font-size:10px;font-weight:700;letter-spacing:.11em;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.rule{height:1px;margin:19px 0;background:rgba(202,220,207,.16)}.subject{margin-top:7px;font-size:23px;line-height:1.18;font-weight:650;letter-spacing:-.025em;overflow-wrap:anywhere}.task{margin-top:6px;color:#b3bdb6;font-size:13px;line-height:1.4;overflow-wrap:anywhere}.elapsed{margin-top:6px;font-size:31px;line-height:1;font-weight:650;letter-spacing:-.035em;font-variant-numeric:tabular-nums}.state-label{color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.13em;white-space:nowrap}.last{margin-top:17px;padding-top:13px;border-top:1px solid rgba(202,220,207,.13);display:none}.last.visible{display:block}.last-line{margin-top:5px;color:#dce5de;font-size:12px;line-height:1.4}.last-meta{margin-top:4px;color:var(--muted);font-size:10px}.music-card{position:absolute;left:48px;bottom:42px;width:365px;max-width:calc(100vw - 96px);display:flex;align-items:center;gap:13px;padding:13px 16px;border:1px solid var(--border);border-radius:13px;background:var(--panel);box-shadow:0 12px 34px rgba(0,0,0,.18);backdrop-filter:blur(12px);opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .35s ease}.music-card.visible{opacity:1;transform:translateY(0)}.youtube-mark{width:37px;height:27px;flex:0 0 auto;display:grid;place-items:center;border-radius:8px;background:#ef4444}.music-copy{min-width:0;flex:1}.music-kicker{color:var(--muted);font-size:9px;line-height:1.2;font-weight:750;letter-spacing:.15em;text-transform:uppercase}.music-title{margin-top:4px;color:var(--text);font-size:14px;line-height:1.25;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.music-artist{margin-top:3px;color:#b3bdb6;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-card{position:absolute;right:48px;bottom:42px;width:340px;height:390px;display:none;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:15px;background:var(--panel);box-shadow:0 12px 34px rgba(0,0,0,.2);backdrop-filter:blur(12px)}.chat-card.visible{display:flex}.chat-head{height:42px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(202,220,207,.16)}.chat-title{color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.16em}.chat-channel{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#b8dcc3;font-size:10px;font-weight:650}.chat-frame{width:100%;height:calc(100% - 42px);border:0;background:#0e0e10}@media(max-width:700px){.chat-card{right:20px;bottom:20px;width:min(340px,calc(100vw - 40px));height:340px}.music-card{bottom:20px}}.toast{position:absolute;left:50%;top:42px;transform:translate(-50%,-18px);min-width:340px;padding:17px 24px;border:1px solid rgba(145,203,165,.35);border-radius:14px;background:rgba(19,26,23,.96);box-shadow:0 18px 55px rgba(0,0,0,.28);text-align:center;opacity:0;pointer-events:none}.toast.show{animation:toastIn 3.4s cubic-bezier(.2,.8,.2,1) both}.toast .toast-kicker{font-size:9px;letter-spacing:.2em;font-weight:800;color:var(--accent)}.toast .toast-title{margin-top:5px;font-size:19px;font-weight:700;letter-spacing:-.02em}.toast .toast-sub{margin-top:4px;color:var(--muted);font-size:11px}.toast .line{height:2px;margin:13px auto 0;width:0;background:var(--accent);animation:lineGrow 1s .25s ease-out forwards}@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-18px)}12%,78%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}@keyframes lineGrow{to{width:100%}}@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(145,203,165,0)}50%{box-shadow:0 0 28px rgba(145,203,165,.22)}}.panel.start-flash{animation:glow 1.1s ease-out 1}@media(max-width:700px){body{padding:20px}.panel{right:20px;top:20px;width:min(430px,calc(100vw - 40px))}.music-card{left:20px;bottom:20px;max-width:calc(100vw - 40px)}}
</style></head><body>
<main class="panel" id="panel"><section class="top"><div><div class="eyebrow">Current local time · SGT</div><div class="clock" id="clock">--:--:--</div><div class="date" id="date">Loading date</div></div><div class="status"><span class="dot" id="dot"></span><span id="status">READY</span></div></section><div class="rule"></div><section><div class="eyebrow">Currently studying</div><div class="subject" id="subject">Your subject</div><div class="task" id="task">Your current topic or task</div></section><div class="rule"></div><section class="bottom"><div><div class="eyebrow">Time studied</div><div class="elapsed" id="elapsed">00:00:00</div></div><div class="state-label" id="stateLabel">SESSION NOT STARTED</div></section><section class="last" id="last"><div class="eyebrow">Last study session</div><div class="last-line" id="lastTitle"></div><div class="last-meta" id="lastMeta"></div></section></main>
<aside class="music-card" id="musicCard"><div class="youtube-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M8 5.8v12.4L18 12 8 5.8z"/></svg></div><div class="music-copy"><div class="music-kicker">Now playing · YouTube</div><div class="music-title" id="musicTitle"></div><div class="music-artist" id="musicArtist"></div></div></aside>
<aside class="chat-card" id="chatCard"><div class="chat-head"><span class="chat-title">LIVE CHAT</span><span class="chat-channel" id="chatChannel"></span></div><iframe class="chat-frame" id="chatFrame" title="Twitch live chat" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></aside>
<div class="toast" id="toast"><div class="toast-kicker" id="toastKicker">FOCUS SESSION</div><div class="toast-title" id="toastTitle">Study session started</div><div class="toast-sub" id="toastSub"></div><div class="line"></div></div>
<script>
const defaults={subject:'Your subject',task:'Your current topic or task',accumulatedMs:0,startedAt:null,running:false,musicTitle:'',musicArtist:'',showMusic:true,musicPlaying:false,lastSession:null,animation:null,animationId:0,twitchChannel:''};let state={...defaults},lastAnimationId=0;const $=id=>document.getElementById(id);
function pad(n){return String(n).padStart(2,'0')}function elapsed(){return Math.max(0,Number(state.accumulatedMs)||0)+(state.running&&state.startedAt?Math.max(0,Date.now()-state.startedAt):0)}function duration(ms){let s=Math.floor(ms/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`}
function clock(){let d=new Date();$('clock').textContent=new Intl.DateTimeFormat('en-SG',{timeZone:'Asia/Singapore',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);$('date').textContent=new Intl.DateTimeFormat('en-SG',{timeZone:'Asia/Singapore',weekday:'long',day:'numeric',month:'long'}).format(d).toUpperCase()}
function showAnimation(type){if(type!=='start'&&type!=='stop')return;const toast=$('toast');toast.classList.remove('show');void toast.offsetWidth;if(type==='start'){$('toastKicker').textContent='FOCUS SESSION';$('toastTitle').textContent='Study session started';$('toastSub').textContent=state.subject+' · '+state.task;$('panel').classList.remove('start-flash');void $('panel').offsetWidth;$('panel').classList.add('start-flash')}else{$('toastKicker').textContent='SESSION COMPLETE';$('toastTitle').textContent='Well done. Session saved.';$('toastSub').textContent=state.lastSession?duration(state.lastSession.durationMs)+' studied':'Study session ended'}toast.classList.add('show')}
function render(){ const channel=String(state.twitchChannel||'').trim().toLowerCase();const chat=$('chatCard');chat.classList.toggle('visible',Boolean(channel));$('chatChannel').textContent=channel?'twitch.tv/'+channel:'';const frame=$('chatFrame');const chatUrl=channel?'https://www.twitch.tv/embed/'+encodeURIComponent(channel)+'/chat?parent=127.0.0.1&darkpopout=1':'';if(frame.dataset.channel!==channel){frame.dataset.channel=channel;frame.src=chatUrl||'about:blank'} $('subject').textContent=state.subject||'No subject set';$('task').textContent=state.task||'No task set';$('elapsed').textContent=duration(elapsed());$('status').textContent=state.running?'STUDYING':elapsed()>0?'PAUSED':'READY';$('stateLabel').textContent=state.running?'FOCUS SESSION':elapsed()>0?'SESSION PAUSED':'SESSION NOT STARTED';$('dot').style.opacity=state.running?'1':'.45';const m=$('musicCard');m.classList.toggle('visible',Boolean(state.showMusic&&state.musicTitle));$('musicTitle').textContent=state.musicTitle||'';$('musicArtist').textContent=state.musicArtist||'';$('musicArtist').style.display=state.musicArtist?'block':'none';const last=state.lastSession;if(last){$('last').classList.add('visible');$('lastTitle').textContent=`${last.subject} · ${last.task||''}`;$('lastMeta').textContent=`${duration(last.durationMs)} · ${last.endedLabel||'Previous session'}`}else{$('last').classList.remove('visible')}}
async function refresh(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error();const next={...defaults,...await r.json()};const hasNewAnimation=next.animationId&&next.animationId!==lastAnimationId;state=next;if(hasNewAnimation){lastAnimationId=next.animationId;showAnimation(next.animation)}render()}catch{$('status').textContent='OFFLINE'}}
clock();render();refresh();setInterval(clock,1000);setInterval(()=>{$('elapsed').textContent=duration(elapsed())},250);setInterval(refresh,700);
</script></body></html>
