<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Status Overlay</title><style>
:root{--panel:rgba(19,26,23,.93);--border:rgba(202,220,207,.18);--text:#f1f4f0;--muted:#a6b9ab;--accent:#91cba5}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text)}.panel{position:absolute;left:75.1%;top:3.9%;width:22.4%;min-width:330px;padding:25px 27px 23px;border:1px solid var(--border);border-radius:18px;background:var(--panel);box-shadow:0 14px 42px rgba(0,0,0,.2);backdrop-filter:blur(12px)}.top,.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.eyebrow{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.clock{margin-top:5px;font-size:35px;font-weight:650;letter-spacing:-.045em;font-variant-numeric:tabular-nums}.date{margin-top:3px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 11px;background:rgba(145,203,165,.13);color:#b8dcc3;font-size:10px;font-weight:700;letter-spacing:.11em;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.rule{height:1px;margin:19px 0;background:rgba(202,220,207,.16)}.subject{margin-top:7px;font-size:23px;line-height:1.18;font-weight:650;letter-spacing:-.025em;overflow-wrap:anywhere}.task{margin-top:6px;color:#b3bdb6;font-size:13px;line-height:1.4;overflow-wrap:anywhere}.elapsed{margin-top:6px;font-size:31px;line-height:1;font-weight:650;letter-spacing:-.035em;font-variant-numeric:tabular-nums}.state-label{color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.13em;white-space:nowrap}.last{margin-top:17px;padding-top:13px;border-top:1px solid rgba(202,220,207,.13);display:none}.last.visible{display:block}.last-line{margin-top:5px;color:#dce5de;font-size:12px;line-height:1.4}.last-meta{margin-top:4px;color:var(--muted);font-size:10px}.music-card{position:absolute;left:2.5%;top:90.2%;width:19%;min-width:270px;display:flex;align-items:center;gap:13px;padding:13px 16px;border:1px solid var(--border);border-radius:13px;background:var(--panel);box-shadow:0 12px 34px rgba(0,0,0,.18);backdrop-filter:blur(12px);opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .35s ease}.music-card.visible{opacity:1;transform:translateY(0)}.youtube-mark{width:37px;height:27px;flex:0 0 auto;display:grid;place-items:center;border-radius:8px;background:#ef4444}.music-copy{min-width:0;flex:1}.music-kicker{color:var(--muted);font-size:9px;line-height:1.2;font-weight:750;letter-spacing:.15em;text-transform:uppercase}.music-title{margin-top:4px;color:var(--text);font-size:14px;line-height:1.25;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.music-artist{margin-top:3px;color:#b3bdb6;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-card{position:absolute;left:75.5%;top:56.2%;width:17.7%;min-width:270px;height:39.8%;display:none;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:15px;background:var(--panel);box-shadow:0 12px 34px rgba(0,0,0,.2);backdrop-filter:blur(12px)}.chat-card.visible{display:flex}.chat-head{height:42px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(202,220,207,.16)}.chat-title{color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.16em}.chat-channel{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#b8dcc3;font-size:10px;font-weight:650}.chat-frame{width:100%;height:calc(100% - 42px);border:0;background:transparent}.toast{position:absolute;left:50%;top:42px;transform:translate(-50%,-18px);min-width:340px;padding:17px 24px;border:1px solid rgba(145,203,165,.35);border-radius:14px;background:rgba(19,26,23,.96);box-shadow:0 18px 55px rgba(0,0,0,.28);text-align:center;opacity:0;pointer-events:none}.toast.show{animation:toastIn 3.4s cubic-bezier(.2,.8,.2,1) both}.toast .toast-kicker{font-size:9px;letter-spacing:.2em;font-weight:800;color:var(--accent)}.toast .toast-title{margin-top:5px;font-size:19px;font-weight:700;letter-spacing:-.02em}.toast .toast-sub{margin-top:4px;color:var(--muted);font-size:11px}.toast .line{height:2px;margin:13px auto 0;width:0;background:var(--accent);animation:lineGrow 1s .25s ease-out forwards}@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-18px)}12%,78%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}@keyframes lineGrow{to{width:100%}}@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(145,203,165,0)}50%{box-shadow:0 0 28px rgba(145,203,165,.22)}}.panel.start-flash{animation:glow 1.1s ease-out 1}.off{display:none!important}
.mini-card{position:absolute;left:2.5%;top:3.9%;width:12%;min-width:150px;padding:15px 17px 14px;border:1px solid var(--border);border-radius:14px;background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.16);backdrop-filter:blur(12px);display:none}.mini-card.visible{display:block}.mini-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.mini-num{margin-top:7px;font-size:27px;font-weight:650;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1}.mini-sub{margin-top:5px;color:var(--muted);font-size:9px;letter-spacing:.08em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.live-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:8px;font-weight:800;letter-spacing:.12em;background:rgba(239,68,68,.16);color:#f9b3b3}.live-pill.offline{background:rgba(166,185,171,.12);color:var(--muted)}.live-pill i{width:6px;height:6px;border-radius:50%;background:#ef4444}.bar{height:6px;margin-top:10px;border-radius:3px;background:rgba(202,220,207,.14);overflow:hidden}.fill{height:100%;width:0;border-radius:3px;background:var(--accent);transition:width .5s ease}.pom-phase{color:var(--accent);font-size:9px;font-weight:800;letter-spacing:.13em}.pom-phase.break{color:#f1c001}
/* Cards live on a fixed 1920x1080 design stage that scales uniformly to
   the browser-source size, so px-based content (min-widths, typography)
   can never disagree with %-based positions: at 1920x1080 the scale is
   exactly 1 (identical to the pre-stage layout) and smaller sources
   shrink the whole composition instead of clipping or overlapping cards. */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
/* Card placements can be overridden per profile from layout.html - the
   CSS defaults above match the built-in "study" profile. */
</style></head><body>
<div id="stage"><main class="panel" id="panel"><section class="top"><div><div class="eyebrow" id="timeEyebrow">Current local time</div><div class="clock" id="clock">--:--:--</div><div class="date" id="date">Loading date</div></div><div class="status"><span class="dot" id="dot"></span><span id="status">READY</span></div></section><div class="rule"></div><section><div class="eyebrow">Currently studying</div><div class="subject" id="subject">Your subject</div><div class="task" id="task">Your current topic or task</div></section><div class="rule"></div><section class="bottom"><div><div class="eyebrow">Time studied</div><div class="elapsed" id="elapsed">00:00:00</div></div><div class="state-label" id="stateLabel">SESSION NOT STARTED</div></section><section class="last" id="last"><div class="eyebrow">Last study session</div><div class="last-line" id="lastTitle"></div><div class="last-meta" id="lastMeta"></div></section></main>
<aside class="music-card" id="musicCard"><div class="youtube-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M8 5.8v12.4L18 12 8 5.8z"/></svg></div><div class="music-copy"><div class="music-kicker">Now playing · YouTube</div><div class="music-title" id="musicTitle"></div><div class="music-artist" id="musicArtist"></div></div></aside>
<aside class="chat-card" id="chatCard"><div class="chat-head"><span class="chat-title">LIVE CHAT</span><span class="chat-channel" id="chatChannel"></span></div><iframe class="chat-frame" id="chatFrame" title="Combined Twitch and Kick live chat" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></aside>
<aside class="mini-card" id="statsCard"><div class="mini-top"><span class="eyebrow">Live viewers</span><span class="live-pill" id="livePill"><i></i><span id="livePillText">LIVE</span></span></div><div class="mini-num" id="viewersNum">—</div><div class="mini-sub" id="statsSub"></div></aside>
<aside class="mini-card" id="pomodoroCard"><div class="mini-top"><span class="eyebrow">Pomodoro</span><span class="pom-phase" id="pomPhase">FOCUS</span></div><div class="mini-num" id="pomTime">25:00</div><div class="bar"><div class="fill" id="pomFill"></div></div></aside>
<aside class="mini-card" id="goalCard"><div class="mini-top"><span class="eyebrow">Daily study goal</span><span class="mini-sub" id="goalPct">0%</span></div><div class="mini-num" id="goalTime">00:00</div><div class="bar"><div class="fill" id="goalFill"></div></div><div class="mini-sub" id="goalSub"></div></aside>
<div class="toast" id="toast"><div class="toast-kicker" id="toastKicker">FOCUS SESSION</div><div class="toast-title" id="toastTitle">Study session started</div><div class="toast-sub" id="toastSub"></div><div class="line"></div></div>
</div>
<script>
const defaults={subject:'Your subject',task:'Your current topic or task',accumulatedMs:0,startedAt:null,running:false,musicTitle:'',musicArtist:'',showMusic:true,musicPlaying:false,lastSession:null,animation:null,animationId:0,twitchChannel:'',kickChannel:'',timezone:'Asia/Singapore',locale:'en-SG',dailyGoalMs:0,pomodoro:{running:false,phase:null,endsAt:null,remainingMs:0,phaseLenMs:0,focusMin:25,breakMin:5,cycles:0},stats:{viewers:null,isLive:null,updatedAt:null,source:''}};let state={...defaults},lastAnimationId=0,timeFmt=null,dateFmt=null,tzTag='',tzDayFmt=null,lastFmtKey='';const $=id=>document.getElementById(id);
const pageParams=new URLSearchParams(window.location.search);
if(pageParams.get('mode')==='wait'){document.documentElement.classList.add('wait-mode')}
function pad(n){return String(n).padStart(2,'0')}function elapsed(){return Math.max(0,Number(state.accumulatedMs)||0)+(state.running&&state.startedAt?Math.max(0,Date.now()-state.startedAt):0)}function duration(ms){let s=Math.floor(ms/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`}
function timeZoneLabel(tz){try{const t=new Intl.DateTimeFormat(undefined,{timeZone:tz,timeZoneName:'short'}).formatToParts().find(p=>p.type==='timeZoneName');return t?t.value.toUpperCase():''}catch{return ''}}
function buildFormatters(){const tz=(state.timezone&&state.timezone!=='auto')?state.timezone:undefined;const loc=state.locale||undefined;try{timeFmt=new Intl.DateTimeFormat(loc,{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}catch{timeFmt=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}try{dateFmt=new Intl.DateTimeFormat(loc,{timeZone:tz,weekday:'long',day:'numeric',month:'long'})}catch{dateFmt=new Intl.DateTimeFormat(undefined,{weekday:'long',day:'numeric',month:'long'})}try{tzDayFmt=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'})}catch{tzDayFmt=new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit'})}tzTag=timeZoneLabel(tz)||'';$('timeEyebrow').textContent=tzTag?`Current local time · ${tzTag}`:'Current local time'}
/* Layout profiles: which arrangement to use. An explicit ?layout=name
   always wins, otherwise each scene falls back to the profile chosen in
   layout.html for that scene (state.sceneLayouts). */
function layoutProfile(){const requested=pageParams.get('layout');if(requested&&state.layouts&&state.layouts[requested])return state.layouts[requested];const scene=pageParams.get('mode')==='wait'?(state.sceneLayouts&&state.sceneLayouts.wait):(state.sceneLayouts&&state.sceneLayouts.study);if(scene&&state.layouts&&state.layouts[scene])return state.layouts[scene];const any=state.layouts&&Object.values(state.layouts)[0];return any||null}
function applyCard(el,cfg,height){if(!el||!cfg)return;el.style.left=cfg.x+'%';el.style.top=cfg.y+'%';el.style.width=cfg.w+'%';if(height&&cfg.h)el.style.height=cfg.h+'%';el.style.right='' ;el.style.bottom='';el.classList.toggle('off',!cfg.on)}
function applyLayout(){const lay=layoutProfile();if(lay){applyCard($('panel'),lay.panel,false);applyCard($('musicCard'),lay.music,false);applyCard($('chatCard'),lay.chat,true);[['statsCard','stats'],['pomodoroCard','pomodoro'],['goalCard','goal']].forEach(([id,key])=>{const cfg=lay[key];if(cfg)applyCard($(id),cfg,false);else $(id).classList.add('off')});var lastOn=lay.last;$('last').classList.toggle('off',lastOn===false)}if(pageParams.get('mode')==='wait'){$('panel').classList.add('off')}}
function showAnimation(type){if(type!=='start'&&type!=='stop'&&type!=='pomodoro')return;const toast=$('toast');toast.classList.remove('show');void toast.offsetWidth;if(type==='start'){$('toastKicker').textContent='FOCUS SESSION';$('toastTitle').textContent='Study session started';$('toastSub').textContent=state.subject+' · '+state.task;$('panel').classList.remove('start-flash');void $('panel').offsetWidth;$('panel').classList.add('start-flash')}else if(type==='pomodoro'){const pom=state.pomodoro||{};if(pom.phase==='break'){$('toastKicker').textContent='POMODORO';$('toastTitle').textContent='Break time';$('toastSub').textContent=(pom.breakMin||5)+' minutes - step away, then come back'}else{$('toastKicker').textContent='POMODORO';$('toastTitle').textContent='Back to your desk';$('toastSub').textContent=(pom.focusMin||25)+' minutes focus · '+(state.subject||'')}}else{$('toastKicker').textContent='SESSION COMPLETE';$('toastTitle').textContent='Well done. Session saved.';$('toastSub').textContent=state.lastSession?duration(state.lastSession.durationMs)+' studied':'Study session ended'}toast.classList.add('show')}
function durWords(ms){const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`}
function todayKey(){try{return tzDayFmt?tzDayFmt.format(new Date()):new Date().toISOString().slice(0,10)}catch{return new Date().toISOString().slice(0,10)}}
function todayStudied(){const key=todayKey();let total=0;const log=Array.isArray(state.sessionLog)?state.sessionLog:[];log.forEach(e=>{let day='';try{day=tzDayFmt?tzDayFmt.format(new Date(e.endedAt)):String(e.endedAt||'').slice(0,10)}catch{day=''}if(day===key)total+=Number(e.durationMs)||0});if(state.running)total+=elapsed();return total}
function renderStats(){const stats=state.stats||{};const pill=$('livePill');const known=stats.isLive===true||stats.isLive===false;pill.classList.toggle('offline',stats.isLive===false);pill.style.display=known?'inline-flex':'none';$('livePillText').textContent=stats.isLive?'LIVE':'OFFLINE';const num=$('viewersNum');if(stats.viewers!=null&&stats.viewers>=0){try{num.textContent=Number(stats.viewers).toLocaleString(state.locale||undefined)}catch{num.textContent=String(stats.viewers)}}else{num.textContent='—'}const src=String(stats.source||'');$('statsSub').textContent=src==='manual'?'count set manually':src==='twitch'?'from your Twitch tab':src==='kick'?'from your Kick tab':'from the browser extension';$('statsCard').classList.toggle('visible',true)}
function setPct(el,v){if(el.style.width!==v)el.style.width=v}
function renderPomodoro(){const pom=state.pomodoro||{};const running=!!pom.running&&!!pom.endsAt;const phase=pom.phase||'focus';const remaining=running?Math.max(0,pom.endsAt-Date.now()):Math.max(0,Number(pom.remainingMs)||((phase==='break'?(pom.breakMin||5):(pom.focusMin||25)))*60000);const mm=Math.floor(remaining/60000),ss=Math.floor(remaining%60000/1000);setText($('pomTime'),`${pad(mm)}:${pad(ss)}`);const label=$('pomPhase');setText(label,phase==='break'?'BREAK':'FOCUS');label.classList.toggle('break',phase==='break');const len=Number(pom.phaseLenMs)||((phase==='break'?(pom.breakMin||5):(pom.focusMin||25)))*60000;const frac=len?Math.min(1,Math.max(0,(len-remaining)/len)):0;setPct($('pomFill'),(frac*100).toFixed(1)+'%');$('pomodoroCard').classList.toggle('visible',true)}
function renderGoal(){const goalMs=Number(state.dailyGoalMs)||0;const studied=todayStudied();$('goalTime').textContent=durWords(studied);let pct;if(goalMs){pct=Math.min(100,Math.round(100*studied/goalMs));$('goalSub').textContent=`${durWords(goalMs)} goal · ${durWords(Math.max(0,goalMs-studied))} to go`}else{pct=null;$('goalSub').textContent='Set a daily goal in the control panel'}$('goalPct').textContent=pct==null?'—':`${pct}%`;if(pct!=null)$('goalFill').style.width=pct+'%';$('goalCard').classList.toggle('visible',true)}
function render(){ const twitch=String(state.twitchChannel||'').trim().toLowerCase();const kick=String(state.kickChannel||'').trim().toLowerCase();const chat=$('chatCard');chat.classList.toggle('visible',Boolean(twitch||kick));$('chatChannel').textContent=[twitch?'TWITCH':'',kick?'KICK':''].filter(Boolean).join(' + ');const frame=$('chatFrame');const chatKey=twitch+'|'+kick;const params=new URLSearchParams();if(twitch)params.set('twitch',twitch);if(kick)params.set('kick',kick);params.set('fade','120');params.set('size','13');params.set('max','14');const chatUrl=(twitch||kick)?'https://unified-chat.com/overlay?'+params.toString():'';if(frame.dataset.channel!==chatKey){frame.dataset.channel=chatKey;frame.src=chatUrl||'about:blank'} $('subject').textContent=state.subject||'No subject set';$('task').textContent=state.task||'No task set';$('elapsed').textContent=duration(elapsed());$('status').textContent=state.running?'STUDYING':elapsed()>0?'PAUSED':'READY';$('stateLabel').textContent=state.running?'FOCUS SESSION':elapsed()>0?'SESSION PAUSED':'SESSION NOT STARTED';$('dot').style.opacity=state.running?'1':'.45';const m=$('musicCard');m.classList.toggle('visible',Boolean(state.showMusic&&state.musicTitle));$('musicTitle').textContent=state.musicTitle||'';$('musicArtist').textContent=state.musicArtist||'';$('musicArtist').style.display=state.musicArtist?'block':'none';const last=state.lastSession;if(last){$('last').classList.add('visible');$('lastTitle').textContent=`${last.subject} · ${last.task||''}`;$('lastMeta').textContent=`${duration(last.durationMs)} · ${last.endedLabel||'Previous session'}`}else{$('last').classList.remove('visible')}renderStats();renderGoal()}
async function refresh(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error();const next={...defaults,...await r.json()};const hasNewAnimation=next.animationId&&next.animationId!==lastAnimationId;const fmtKey=(next.timezone||'')+'|'+(next.locale||'')+'|'+JSON.stringify(next.layouts||{})+'|'+JSON.stringify(next.sceneLayouts||{});const rebuilt=fmtKey!==lastFmtKey;state=next;lastFmtKey=fmtKey;if(rebuilt){buildFormatters();applyLayout()}if(hasNewAnimation){lastAnimationId=next.animationId;showAnimation(next.animation)}render()}catch{$('status').textContent='OFFLINE'}}
function fitStage(){const s=Math.min(innerWidth/1920,innerHeight/1080);const dx=Math.round((innerWidth-1920*s)/2),dy=Math.round((innerHeight-1080*s)/2);$('stage').style.transform=`translate(${dx}px, ${dy}px) scale(${s})`}
buildFormatters();applyLayout();fitStage();clock();render();renderPomodoro();refresh();addEventListener('resize',fitStage);setInterval(clock,1000);setInterval(()=>{setText($('elapsed'),duration(elapsed()));renderPomodoro()},250);setInterval(refresh,700);
function setText(el,v){if(el.textContent!==v)el.textContent=v}
function clock(){let d=new Date();setText($('clock'),timeFmt?timeFmt.format(d):'--:--:--');setText($('date'),dateFmt?dateFmt.format(d):'');if(!tzTag)buildFormatters();}
</script></body></html>
