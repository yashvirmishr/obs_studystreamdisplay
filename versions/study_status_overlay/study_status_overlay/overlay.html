<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Status Overlay</title>
  <style>
    :root {
      --panel: rgba(19, 26, 23, .91);
      --border: rgba(202, 220, 207, .18);
      --text: #f1f4f0;
      --muted: #a6b9ab;
      --accent: #91cba5;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 42px 48px;
    }
    .panel {
      width: 430px;
      padding: 25px 27px 23px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 14px 42px rgba(0,0,0,.20);
      backdrop-filter: blur(12px);
    }
    .top, .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
    .eyebrow { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .clock { margin-top: 5px; font-size: 35px; font-weight: 650; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
    .date { margin-top: 3px; color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .status { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 8px 11px; background: rgba(145,203,165,.13); color: #b8dcc3; font-size: 10px; font-weight: 700; letter-spacing: .11em; white-space: nowrap; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .rule { height: 1px; margin: 19px 0; background: rgba(202,220,207,.16); }
    .subject { margin-top: 7px; font-size: 23px; line-height: 1.18; font-weight: 650; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .task { margin-top: 6px; color: #b3bdb6; font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
    .elapsed { margin-top: 6px; font-size: 31px; line-height: 1; font-weight: 650; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
    .state-label { color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: .13em; white-space: nowrap; }
    @media (max-width: 700px) {
      body { padding: 20px; }
      .panel { width: min(430px, calc(100vw - 40px)); }
    }
  </style>
</head>
<body>
  <main class="panel" aria-label="Study status">
    <section class="top">
      <div>
        <div class="eyebrow">Current local time · SGT</div>
        <div class="clock" id="clock">--:--:--</div>
        <div class="date" id="date">Loading date</div>
      </div>
      <div class="status"><span class="dot" id="dot"></span><span id="status">READY</span></div>
    </section>
    <div class="rule"></div>
    <section>
      <div class="eyebrow">Currently studying</div>
      <div class="subject" id="subject">Your subject</div>
      <div class="task" id="task">Your current topic or task</div>
    </section>
    <div class="rule"></div>
    <section class="bottom">
      <div>
        <div class="eyebrow">Time studied</div>
        <div class="elapsed" id="elapsed">00:00:00</div>
      </div>
      <div class="state-label" id="stateLabel">SESSION NOT STARTED</div>
    </section>
  </main>
  <script>
    const defaults = { subject: 'Your subject', task: 'Your current topic or task', accumulatedMs: 0, startedAt: null, running: false };
    let state = { ...defaults };

    async function refreshState() {
      try {
        const response = await fetch('/api/state', { cache: 'no-store' });
        if (!response.ok) throw new Error(`State request failed: ${response.status}`);
        const next = await response.json();
        state = { ...defaults, ...next };
      } catch (error) {
        document.getElementById('status').textContent = 'OFFLINE';
      }
      render();
    }
    function elapsedMs() {
      const base = Math.max(0, Number(state.accumulatedMs) || 0);
      return base + (state.running && state.startedAt ? Math.max(0, Date.now() - state.startedAt) : 0);
    }
    function pad(value) { return String(value).padStart(2, '0'); }
    function formatDuration(ms) {
      const total = Math.floor(ms / 1000);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = new Intl.DateTimeFormat('en-SG', {
        timeZone: 'Asia/Singapore', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      }).format(now);
      document.getElementById('date').textContent = new Intl.DateTimeFormat('en-SG', {
        timeZone: 'Asia/Singapore', weekday: 'long', day: 'numeric', month: 'long'
      }).format(now).toUpperCase();
    }
    function render() {
      document.getElementById('subject').textContent = state.subject || 'No subject set';
      document.getElementById('task').textContent = state.task || 'No task set';
      document.getElementById('elapsed').textContent = formatDuration(elapsedMs());
      document.getElementById('status').textContent = state.running ? 'STUDYING' : (elapsedMs() > 0 ? 'PAUSED' : 'READY');
      document.getElementById('stateLabel').textContent = state.running ? 'FOCUS SESSION' : (elapsedMs() > 0 ? 'SESSION PAUSED' : 'SESSION NOT STARTED');
      document.getElementById('dot').style.opacity = state.running ? '1' : '.45';
    }
    updateClock(); render();
    refreshState();
    setInterval(updateClock, 1000);
    setInterval(render, 250);
    setInterval(refreshState, 1000);
  </script>
</body>
</html>
